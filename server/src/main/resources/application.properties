# 문서는 기본 비활성화하며, local Profile에서만 별도 설정으로 활성화합니다.
springdoc.api-docs.enabled=false
# UI는 Docker의 4000 포트에서 제공하고 API 서버에는 등록하지 않습니다.
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**
# Controller에 명시한 응답 계약을 사용해 예외 처리기의 응답을 모든 API에 일괄 적용하지 않습니다.
springdoc.override-with-generic-response=false

# 새 체크아웃에서도 인증과 저장소의 공통 기준을 읽으며 실제 주소·키는 실행 환경에서 주입합니다.
spring.application.name=moahome-server
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
moahome.security.issuer=moahome-server
moahome.security.audience=moahome-api
moahome.security.allowed-origins=${WEB_ALLOWED_ORIGINS:http://localhost:3000}
moahome.security.cookie-secure=true
moahome.kakao.client-id=${KAKAO_CLIENT_ID:}
moahome.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
moahome.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
moahome.kakao.web-login-success-uri=${WEB_LOGIN_SUCCESS_URI:}

# 공개 Health는 상태만 반환합니다. 설정·DB 주소·개인정보가 포함된 상세 endpoint는 노출하지 않습니다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
