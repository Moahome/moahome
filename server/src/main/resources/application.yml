spring:
  application:
    name: moahome-server

  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      connect-timeout: 3s
      timeout: 3s

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    clean-disabled: true

server:
  port: 8080

moahome:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64:}
    issuer: moahome-server
    audience: moahome-api
    allowed-origins: ${WEB_ALLOWED_ORIGINS:http://localhost:3000}
    cookie-secure: true

---

spring:
  config:
    activate:
      on-profile: local
    import: "optional:file:.env[.properties]"

moahome:
  security:
    cookie-secure: false
