# 운영은 로컬 .env import 없이 외부 환경변수로만 연결합니다.
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.connect-timeout=3s
spring.data.redis.timeout=3s
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

moahome.security.allowed-origins=${WEB_ALLOWED_ORIGINS}
moahome.security.cookie-secure=true
springdoc.api-docs.enabled=false

# 요청을 받을 준비가 됐는지와 저장소 연결을 함께 검사해 단순 프로세스 실행을 정상 배포로 오인하지 않습니다.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=OFF
