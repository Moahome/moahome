# 로컬 .env·DB 설정을 읽지 않는 테스트 전용 프로필입니다. 실제 DB 검증은 database-test가 주입합니다.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms
moahome.kakao.client-id=test-kakao-client
moahome.kakao.client-secret=${random.uuid}
moahome.kakao.redirect-uri=https://api.example.test/login/oauth2/code/kakao
moahome.kakao.web-login-success-uri=https://app.example.test/login/callback
moahome.security.allowed-origins=http://localhost:3000,https://app.example.test
moahome.security.cookie-secure=true
