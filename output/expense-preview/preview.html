<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>지출 계정과목 · 실제 화면 미리보기</title>
  <style>
    :root { --background:#F8FAFC; --card:#FFFFFF; --text:#0F172A; --sub-text:#64748B; --border:#E2E8F0; --primary:#2563EB; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--background); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { max-width:1504px; margin:auto; padding:32px; }
    h1 { margin:0 0 8px; font-size:28px; }
    p { margin:0 0 24px; color:var(--sub-text); }
    nav { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:32px; }
    a { color:var(--primary); text-underline-offset:4px; }
    section { margin:0 0 40px; scroll-margin-top:24px; }
    h2 { margin:0 0 12px; font-size:20px; }
    img { display:block; width:100%; height:auto; border:1px solid var(--border); border-radius:12px; background:var(--card); }
    .mobile { max-width:390px; }
    @media(max-width:600px) { main { padding:20px 12px; } h1 { font-size:24px; } }
  </style>
</head>
<body>
<main>
  <h1>지출 계정과목 선택</h1>
  <p>수정한 실제 화면을 Chrome에서 캡처했습니다. 화면의 거래 정보는 테스트 데이터입니다.</p>
  <nav aria-label="화면별 미리보기">
    <a href="#transfer">103 통장간 거래</a><a href="#receipt">입금 설정 여백 수정</a><a href="#manual">수동 지출 등록</a><a href="#bank">은행 출금 설정</a><a href="#initial">초기 설정</a><a href="#list">지출 목록</a><a href="#mobile">모바일</a>
  </nav>
  <section id="transfer"><h2>103 통장간 거래 · 상대 통장 지정</h2><img src="transfer103Settings.png" alt="실제 은행 업로드에서 103 통장간 거래와 상대 통장을 지정한 화면"></section>
  <section id="receipt"><h2>입금 설정 · 여백과 이체 안내 수정</h2><img src="receiptSettingsPage.png" alt="이체 선택과 입금 용도 입력의 좌우 정렬을 수정한 실제 모달"></section>
  <section id="manual"><h2>수동 지출 등록</h2><img src="manualExpense.png" alt="실제 수동 지출 모달에 추가된 계정과목 검색·선택 입력"></section>
  <section id="bank"><h2>은행 출금 설정</h2><img src="bankExpense.png" alt="은행 업로드 출금 설정의 계정과목 선택"></section>
  <section id="initial"><h2>초기 설정의 지출 입력</h2><img src="initialExpense.png" alt="관리대상 초기 설정의 수기 지출 과목 선택"></section>
  <section id="list"><h2>지출 목록</h2><img src="expenseList.png" alt="코드와 명칭이 표시되는 계정과목 열이 추가된 지출 목록"></section>
  <section id="mobile"><h2>모바일 지출 등록</h2><img class="mobile" src="manualExpenseMobile.png" alt="모바일 실제 지출 등록 페이지의 계정과목 입력"></section>
</main>
</body>
</html>
